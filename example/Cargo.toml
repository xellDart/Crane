[package]
name = "crane-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
crane-core = { path = "../crane-core" }
anyhow = "1.0.100"
image = "0.25.9"

[[bin]]
name = "embedding_simple"
path = "src/embedding_simple.rs"

[[bin]]
name = "embedding_oracle_test"
path = "src/embedding_oracle_test.rs"

[[bin]]
name = "argus_oracle_test"
path = "src/argus_oracle_test.rs"

[features]
default = []
cuda = ["crane-core/cuda"]
flash-attn = ["cuda", "crane-core/flash-attn"]
