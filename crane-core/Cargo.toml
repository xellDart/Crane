[package]
name = "crane-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
rayon = "1.10"

candle-nn = "^0.9.2-alpha.2"
candle-transformers = "0.9.2-alpha.2"
serde = "1.0.219"
serde_json = "1.0.140"
tokenizers = "0.22.2"

candle-flash-attn = { version = "0.9.2", optional = true }
intel-mkl-src = { version = "0.8.1", optional = true }
image = "0.25.9"
half = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.9.2-alpha.2", features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { version = "0.9.2-alpha.2", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.9.2-alpha.2" }

[features]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:bindgen_cuda",
]
flash-attn = [
    "cuda",
    "dep:candle-flash-attn",
]
cudnn = ["candle-core/cudnn"]
mkl = [
    "dep:intel-mkl-src",
    "candle-core/mkl",
    "candle-nn/mkl",
    "candle-transformers/mkl",
]
accelerate = ["candle-core/accelerate"]

[build-dependencies]
bindgen_cuda = { version = "0.1.6", optional = true }
